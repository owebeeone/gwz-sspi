name: Standalone SSPI package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_fixtures:
        description: Run opt-in self-contained Windows native fixtures
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    name: Build, codec, supervision and worker checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Keep build outputs outside the checkout
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gwz-sspi-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned schema tooling
        run: python -m pip install taut-proto==0.10.0
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Schema drift and synthetic conformance
        run: |
          python -B scripts/regen_schema.py --check
          python -B -m unittest discover -s tests/schema -v
      - name: Formatting
        run: |
          cargo fmt --all -- --check
          python -B scripts/check_rustfmt.py
      - name: Strict lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Fast library tier
        run: cargo test --lib --locked
      - name: Caller lifecycle, early dispatch, traits and bootstrap refusal
        run: cargo test --all-features --locked
      - name: Build standalone crate archive
        run: cargo package --locked

  windows-cross:
    name: Windows target inspection (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]
    timeout-minutes: 15
    steps:
      - name: Keep build outputs outside the checkout
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gwz-sspi-cross-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain and target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup target add --toolchain 1.95.0 ${{ matrix.target }}
      - name: Strict target inspection without native execution
        run: cargo clippy --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings

  native-fixtures:
    if: github.event_name == 'workflow_dispatch' && inputs.native_fixtures
    name: Opt-in production Windows fixtures (synthetic metadata)
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GWZ_SSPI_BUILD_FINGERPRINT: '4242424242424242424242424242424242424242424242424242424242424242'
    steps:
      - name: Keep build outputs outside the checkout
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gwz-sspi-native-target" >> "$GITHUB_ENV"
          echo "GWZ_SSPI_NATIVE_SCRATCH=$RUNNER_TEMP/gwz-sspi-native-scratch" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build production worker with synthetic metadata
        run: cargo build --features worker-bin --locked
      - name: Execute opt-in fixtures by normal exit status
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:GWZ_SSPI_NATIVE_SCRATCH | Out-Null
          $env:GWZ_SSPI_NATIVE_WORKER = (Resolve-Path "$env:CARGO_TARGET_DIR/debug/gwz-sspi-worker.exe").Path
          cargo test --all-features --locked --test native_worker -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib --all-features --locked -- --ignored --test-threads=1
          exit $LASTEXITCODE
