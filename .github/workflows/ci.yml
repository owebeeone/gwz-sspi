name: Standalone SSPI package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Build, secret codec and supervision checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/gwz-sspi-target
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned schema tooling
        run: python -m pip install taut-proto==0.10.0
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Schema drift and synthetic conformance
        run: |
          python -B scripts/regen_schema.py --check
          python -B -m unittest discover -s tests/schema -v
      - name: Formatting
        run: |
          cargo fmt --all -- --check
          python -B scripts/check_rustfmt.py
      - name: Strict lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Fast library tier
        run: cargo test --lib --locked
      - name: Caller lifecycle, trait checks and bootstrap refusal
        run: cargo test --all-features --locked
      - name: Build standalone crate archive
        run: cargo package --locked

  windows-cross:
    name: Windows target inspection (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/gwz-sspi-cross-target
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain and target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup target add --toolchain 1.95.0 ${{ matrix.target }}
      - name: Strict target inspection without native execution
        run: cargo clippy --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings
