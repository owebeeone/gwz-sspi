[package]
name = "gwz-sspi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "Contained Windows SSPI authentication conversations for Rust hosts"
readme = "README.md"
# Published only by .github/workflows/release.yml (RELEASE.md); activated by the operator on 2026-10-11.
repository = "https://github.com/owebeeone/gwz-sspi"
include = ["/src/**", "/protocol/**", "/tests/**", "/scripts/**", "/docs/**", "/dev-docs/Implementation.md", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/LICENSE", "/RELEASE.md"]

[workspace]
resolver = "2"

[features]
default = []
worker-bin = []

[[bin]]
name = "gwz-sspi-worker"
path = "src/bin/gwz-sspi-worker.rs"
required-features = ["worker-bin"]

[[test]]
name = "worker_bootstrap"
path = "tests/worker_bootstrap.rs"
required-features = ["worker-bin"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
zeroize = { version = '=1.9.0', default-features = false, features = ['alloc'] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = '=0.61.2', default-features = false, features = ['Win32_Foundation', 'Win32_Security', 'Win32_Storage_FileSystem', 'Win32_System_IO', 'Win32_System_JobObjects', 'Win32_System_Pipes', 'Win32_System_Threading', 'Win32_System_SystemInformation', 'Win32_System_SystemServices', 'Win32_Security_Authentication_Identity', 'Win32_Security_Credentials', 'Win32_System_Rpc'] }

[[test]]
name = "native_worker"
path = "tests/native_worker.rs"
required-features = ["worker-bin"]
